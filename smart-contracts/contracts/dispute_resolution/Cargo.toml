[package]
name = "dispute-resolution"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "=22.0.11" }
gas-interface = { path = "../gas_interface" }

[dev-dependencies]
soroban-sdk = { version = "=22.0.11", features = ["testutils"] }
agent_registry = { path = "../agent_registry" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true




